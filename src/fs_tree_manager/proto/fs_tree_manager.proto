syntax = "proto3";

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

package fs_tree_manager;

option go_package = "github.com/puter/fs_tree_manager";

service FSTreeManager {
  rpc FetchReplica(FetchReplicaRequest) returns (FetchReplicaResponse);

  // It isn't named "mkdir" since it doesn't handle the various parameters
  // supported by "mkdir."
  rpc NewDirectory(FSEntry) returns (google.protobuf.Empty);
}

message FetchReplicaRequest { string user_name = 1; }

message FetchReplicaResponse { MerkleTree tree = 1; }

message MerkleNode {
  // We use the stable uuid from fs_entry so pointers to it stay valid when this
  // node is updated.
  string id = 1;

  string merkle_hash = 2;
  repeated string children_ids = 3;
  string parent_id = 4;
  FSEntry fs_entry = 5;
}

message MerkleTree {
  string root_id = 1;

  // id -> node
  map<string, MerkleNode> nodes = 2;
}

message FSEntry { google.protobuf.Struct metadata = 1; }
